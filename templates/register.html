{% extends "base.html" %}
{% block body %}
<div class="login-box card">
  <h1>Create account</h1>
  <p class="muted">Join DashDoor and start ordering.</p>
  <form method="post" action="{{ url_for('register') }}">
    <input name="username" placeholder="choose a username" autofocus>
    <input name="password" type="password" placeholder="choose a password">
    <button type="submit">Sign up</button>
  </form>
  <p class="muted" style="font-size:13px;margin-top:14px">
    Already have an account? <a href="{{ url_for('login') }}">Sign in</a>
  </p>
</div>
{% endblock %}
